name: nowbar_flutter
description: "A pure-Dart Flutter recreation of the Samsung Now Bar with animated media, notification, routine, sports, and timer surfaces."
version: 0.2.1

repository: https://github.com/winwin-ai/nowbar_flutter
issue_tracker: https://github.com/winwin-ai/nowbar_flutter/issues
topics:
  - widget
  - ui
  - animation
  - now-bar
  - live-activity

platforms:
  android:

screenshots:
  - description: "The timer screen with a running countdown and the status-bar chip."
    path: doc/screenshots/timer-app.jpg
  - description: "The lock-screen Now Bar card showing the running timer."
    path: doc/screenshots/timer-lockscreen.jpg
  - description: "The notification shade's Live info section with the timer card."
    path: doc/screenshots/timer-shade.jpg

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
