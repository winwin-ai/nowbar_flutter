name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version="$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | tr -d '\r')"
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version" >&2
            exit 1
          fi
          if ! grep -q "^## $pubspec_version\$" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $pubspec_version' section" >&2
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Analyze
        run: flutter analyze

      - name: Run tests (golden excluded on Linux)
        run: flutter test --exclude-tags golden

  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Provisions the OIDC token used by pub.dev automated publishing.
      # Its `dart` command is shadowed by the Flutter SDK installed below.
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force
