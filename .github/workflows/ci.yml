name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-format-test:
    name: Analyze / Format / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Analyze
        run: flutter analyze

      - name: Run tests (golden excluded on Linux)
        run: flutter test --exclude-tags golden

  min-sdk:
    name: Minimum SDK (Flutter 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests (golden excluded on Linux)
        run: flutter test --exclude-tags golden

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: [analyze-format-test, min-sdk]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate package
        run: dart pub publish --dry-run
